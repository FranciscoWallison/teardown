<!doctype html>
<html><head><meta charset="utf-8"><title>Gotinha 3D</title>
<style>html,body{margin:0;background:transparent}canvas{image-rendering:pixelated}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head><body>
<script type="module">
// Gotinha 3D -> sprite. Contrato do teardown: render é função pura de (ação, frame, vista).
// Nada é keyframado à mão: toda pose sai de pose(ação, fase 0..1).
import * as THREE from 'three';

const SS = 2;                       // supersampling (depois reduzimos 2x2 -> 1 px)
const CW = 112, CH = 104, AX = 56, AY = 78;   // canvas e ponto de chão (mesmo padrão do projeto)
const W = CW * SS, H = CH * SS;

// ---- câmera do RO: perspectiva com FOV estreito (~15°) olhando de cima (~50°) ----
const FOV = 15, PITCH = 50 * Math.PI / 180;
const DIST = (CH / 2) / Math.tan(FOV / 2 * Math.PI / 180);   // 1 unidade ≈ 1 px no chão
const camera = new THREE.PerspectiveCamera(FOV, CW / CH, 10, 2000);
camera.position.set(0, DIST * Math.sin(PITCH), DIST * Math.cos(PITCH));
camera.lookAt(0, 0, 0);
camera.updateMatrixWorld();
// desloca a vista para o ponto de chão (0,0,0) cair em (AX, AY) do canvas
{
  const p = new THREE.Vector3(0, 0, 0).project(camera);
  const px = (p.x + 1) / 2 * CW, py = (1 - p.y) / 2 * CH;
  camera.setViewOffset(CW, CH, px - AX, py - AY, CW, CH);
}

const renderer = new THREE.WebGLRenderer({antialias: false, alpha: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// luz "pintada": presa à câmera, vem de cima-esquerda da TELA em todas as vistas (como no RO)
scene.add(camera);
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(-1.7, 1.3, 0.7);
camera.add(key);
key.target.position.set(0, 0, -DIST);
camera.add(key.target);
scene.add(new THREE.AmbientLight(0xffffff, 0.45));

// ---- paleta (mesma da Gotinha 2D) ----
const C = {
  outline: 0x163478, dark: 0x2860be, mid: 0x428ce6, light: 0x78befa,
  pale: 0xb4e4ff, white: 0xf5fcff, eye: 0x0e1a3a, mouth: 0x1e3c82, blush: 0x96aaf0,
};
// corpo: shader que grava o "quanto a superfície olha para a luz" (0..1) em cinza.
// As faixas (escuro/médio/claro/brilho) são decididas em Python com limiares fixos,
// iguais em todos os frames e direções. Luz no espaço da câmera = luz pintada do RO.
const LIGHT_VIEW = new THREE.Vector3(-0.75, 0.55, 0.35).normalize();
const bodyMat = new THREE.ShaderMaterial({
  uniforms: {L: {value: LIGHT_VIEW}},
  vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 L; varying vec3 vN; void main(){ float d = dot(normalize(vN), L) * 0.5 + 0.5; gl_FragColor = vec4(d, d, d, 1.0); }`,
});
const flat = (c) => new THREE.MeshBasicMaterial({color: c});

// ---- geometria: gota por torno (lathe), mesmo perfil da versão 2D ----
const R = 14, HT = 2.75 * R;
function profile() {
  const pts = [];
  for (let i = 0; i <= 120; i++) {
    const y = 0.4 + (HT - 0.4) * i / 120;
    let r;
    if (y <= R) r = Math.sqrt(Math.max(0, R * R - (y - R) ** 2));
    else { const t = (y - R) / (HT - R); r = R * Math.pow(1 - t, 0.78) * (1 - 0.12 * Math.sin(Math.PI * t)); }
    pts.push(new THREE.Vector2(Math.max(r, 0.001), y));
  }
  pts.unshift(new THREE.Vector2(0.001, 0.4));
  return pts;
}
const bodyGeo = new THREE.LatheGeometry(profile(), 96);
bodyGeo.computeVertexNormals();

const rig = new THREE.Group();          // raiz: posição no chão + yaw da vista
const squash = new THREE.Group();       // escala de squash/stretch a partir do chão
const lean = new THREE.Group();         // inclinação
rig.add(squash); squash.add(lean);
scene.add(rig);
const body = new THREE.Mesh(bodyGeo, bodyMat); lean.add(body);
const YS = 1.15; // compensação artística da câmera de cima (o corpo e o rosto esticam juntos)

// rosto: preso à superfície da frente (+z), acompanha squash e lean
const face = new THREE.Group(); lean.add(face);
const eyeGeo = new THREE.SphereGeometry(1, 12, 8);
function makeEye(x) {
  const g = new THREE.Group();
  const e = new THREE.Mesh(eyeGeo, flat(C.eye)); e.scale.set(1.7, 2.6, 0.8); g.add(e);
  const s = new THREE.Mesh(eyeGeo, flat(C.white)); s.scale.set(0.6, 0.7, 0.3); s.position.set(0.5, 0.9, 0.7); g.add(s);
  const sq = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.9, 0.8), flat(C.eye)); sq.visible = false; g.add(sq);
  g.userData = {open: [e, s], closed: sq};
  onSphere(g, 30, x, 0.3);
  face.add(g); return g;
}
// coloca um objeto na superfície da esfera do corpo: elevação th (graus) e azimute phi (rad)
function onSphere(o, th, phi, sink = 0) {
  const t = th * Math.PI / 180, rr = R - sink;
  o.position.set(rr * Math.cos(t) * Math.sin(phi), R + rr * Math.sin(t), rr * Math.cos(t) * Math.cos(phi));
  const n = new THREE.Vector3(Math.cos(t) * Math.sin(phi), Math.sin(t), Math.cos(t) * Math.cos(phi));
  o.lookAt(o.position.clone().add(n));
}
const eyes = [makeEye(-0.40), makeEye(0.40)];
const mouthOpen = new THREE.Mesh(eyeGeo, flat(C.mouth)); mouthOpen.scale.set(1.8, 1.4, 0.6);
const mouthSmile = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.5, 6, 12, Math.PI), flat(C.mouth));
for (const m of [mouthOpen, mouthSmile]) { onSphere(m, 13, 0, 0.2); face.add(m); }
mouthSmile.rotateZ(Math.PI);
const blushes = [-0.72, 0.72].map((x) => {
  const b = new THREE.Mesh(eyeGeo, flat(C.blush)); b.scale.set(1.6, 0.8, 0.3);
  onSphere(b, 18, x, 0.1); face.add(b); return b;
});
// brilho especular: arco no alto à esquerda (fixo na tela -> preso à câmera via posição calculada no render)
const shine = new THREE.Mesh(eyeGeo, flat(C.white)); shine.scale.set(1.3, 2.4, 0.4); scene.add(shine);

// partículas (gotinhas) e poça: instâncias determinísticas
const DROPS = 10;
const dropGeo = new THREE.SphereGeometry(1, 10, 8);
const drops = Array.from({length: DROPS}, () => { const m = new THREE.Mesh(dropGeo, bodyMat); scene.add(m); return m; });
const puddle = new THREE.Mesh(new THREE.CircleGeometry(1, 32), bodyMat);
puddle.rotation.x = -Math.PI / 2; puddle.position.y = 0.3; scene.add(puddle);

// gerador determinístico (sem Math.random: render precisa ser puro)
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const r0 = rng(7);
const SPLASH = Array.from({length: DROPS}, (_, i) => ({ang: (i / DROPS) * Math.PI * 2 + r0() * 0.4, sp: 0.7 + r0() * 0.6, up: 0.8 + r0() * 0.6, r: 1.6 + r0() * 1.2}));

// ---- curvas ----
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const bump = (x) => Math.sin(Math.PI * clamp(x));

// ---- POSE: única fonte da verdade. fase p em [0,1) ----
function pose(action, p) {
  const P = {sx: 1, sy: 1, lean: 0, fwd: 0, up: 0, expr: 'normal', drops: [], puddle: 0, bodyVisible: true};
  if (action === 'idle') {
    const s = 0.04 * (1 - Math.cos(2 * Math.PI * p)) / 2 * 2;
    P.sx = 1 + s; P.sy = 1 - s;
  } else if (action === 'walk') {
    // contato (0-.15) -> impulso -> voo (.15-.8) -> pouso (.8-1)
    const air = seg(p, 0.15, 0.8);
    P.up = 9 * bump(air);
    const pre = bump(seg(p, 0, 0.3)) * (p < 0.15 ? 1 : 0);
    const land = bump(seg(p, 0.8, 1.0));
    const stretch = 0.14 * bump(seg(p, 0.15, 0.55));
    P.sy = 1 - 0.16 * (pre + land) + stretch; P.sx = 1 + 0.14 * (pre + land) - 0.08 * stretch / 0.14;
    P.lean = 0.12 * bump(air);
  } else if (action === 'attack') {
    const ATK = 12 / 28;                              // frame do golpe (do molde de referência)
    const ant = seg(p, 0, ATK - 0.14);                 // antecipação
    const lunge = seg(p, ATK - 0.14, ATK);            // bote
    const rec = seg(p, ATK, 0.72);                    // impacto + recuperação
    const back = seg(p, 0.72, 1);                     // volta pulando
    P.sx = 1 + 0.22 * easeInOut(ant) * (1 - lunge) - 0.12 * bump(lunge) + 0.25 * bump(rec * 1.4) * (rec < 0.7 ? 1 : 0);
    P.sy = 1 - 0.24 * easeInOut(ant) * (1 - lunge) + 0.22 * bump(lunge) - 0.25 * bump(rec * 1.4) * (rec < 0.7 ? 1 : 0);
    P.lean = -0.25 * easeInOut(ant) * (1 - lunge) + 0.45 * bump(lunge);
    P.fwd = -3 * easeInOut(ant) * (1 - lunge) + 13 * easeOut(lunge) * (1 - easeInOut(back));
    P.up = 6 * bump(lunge) + 5 * bump(back);
    P.expr = lunge > 0 || (rec > 0 && rec < 0.5) ? 'open' : 'normal';
    if (p >= ATK) {
      const t = (p - ATK) / (1 - ATK) * 1.6;          // tempo desde o impacto
      for (const d of SPLASH) {
        const h = 14 * d.up * t - 22 * t * t;
        if (h > 0 || t < 0.2) P.drops.push({x: Math.cos(d.ang) * 10 * d.sp * t, z: Math.sin(d.ang) * 10 * d.sp * t + P.fwd, y: Math.max(1, h + 4), r: d.r * 0.8});
      }
    }
  } else if (action === 'hurt') {
    const k = seg(p, 0, 0.25), back = seg(p, 0.25, 1);
    P.fwd = -4 * easeOut(k) * (1 - easeInOut(back));
    P.sx = 1 + 0.18 * bump(k * 2) * (1 - back); P.sy = 1 - 0.18 * bump(k * 2) * (1 - back);
    P.lean = -0.2 * (1 - easeInOut(back));
    P.expr = back < 0.6 ? 'squint' : 'normal';
  } else if (action === 'death') {
    const a = seg(p, 0, 0.06), b = seg(p, 0.06, 0.12);
    P.sx = 1 - 0.1 * bump(a) + 0.4 * easeOut(b); P.sy = 1 + 0.15 * bump(a) - 0.45 * easeOut(b);
    P.expr = 'squint';
    if (p >= 0.12) {
      P.bodyVisible = false;
      const t = (p - 0.12) / 0.88 * 2.2;
      for (const d of SPLASH) {
        const h = 18 * d.up * t - 16 * t * t;
        if (h > 0) P.drops.push({x: Math.cos(d.ang) * 14 * d.sp * t, z: Math.sin(d.ang) * 14 * d.sp * t, y: h + 2, r: d.r});
      }
      P.puddle = Math.min(1, 0.4 + t * 0.5);
    }
  }
  return P;
}

const YAW = {S: 0, SW: -45, W: -90, NW: -135, N: 180};

function render(action, k, n, view) {
  const p = k / n;
  const P = pose(action, p);
  const yaw = YAW[view] * Math.PI / 180;
  rig.rotation.y = yaw;
  // deslocamento para frente/trás no sentido em que a gota olha
  rig.position.set(Math.sin(yaw) * P.fwd, P.up, Math.cos(yaw) * P.fwd);
  squash.scale.set(P.sx, P.sy * YS, P.sx);
  lean.rotation.x = P.lean;
  body.visible = face.visible = P.bodyVisible;
  const showFace = P.bodyVisible && (view === 'S' || view === 'SW' || view === 'W');
  face.visible = showFace;
  for (const e of eyes) { e.userData.open.forEach((m) => (m.visible = P.expr !== 'squint')); e.userData.closed.visible = P.expr === 'squint'; }
  mouthOpen.visible = P.expr === 'open'; mouthSmile.visible = P.expr !== 'open';
  blushes.forEach((b) => (b.visible = view === 'S'));
  // brilho: ponto no alto-esquerda da TELA sobre o corpo, acompanha squash (luz pintada)
  shine.visible = P.bodyVisible;
  {
    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    const camFwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const c = new THREE.Vector3().copy(rig.position).add(new THREE.Vector3(0, R * P.sy * YS, 0));
    shine.position.copy(c).addScaledVector(camRight, -R * 0.5 * P.sx).addScaledVector(camUp, R * 0.5 * P.sy * YS).addScaledVector(camFwd, -R * 1.2);
    shine.quaternion.copy(camera.quaternion);
    shine.scale.set(1.5 * P.sx, 2.6 * P.sy * YS, 0.4);
  }
  drops.forEach((m, i) => {
    const d = P.drops[i];
    m.visible = !!d;
    if (d) {
      // gotas no espaço da vista (giram com a gota)
      const x = d.x * Math.cos(yaw) + d.z * Math.sin(yaw), z = -d.x * Math.sin(yaw) + d.z * Math.cos(yaw);
      m.position.set(x, d.y, z); m.scale.setScalar(d.r);
    }
  });
  puddle.visible = P.puddle > 0;
  puddle.scale.set(17 * P.puddle, 17 * P.puddle * 0.9, 1);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
}

window.SIM = {render, pose, CW, CH, AX, AY, SS};
window.READY = true;
</script></body></html>
